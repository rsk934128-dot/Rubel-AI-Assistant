    <!-- Filter benign dev-environment logs like [vite] websocket in sandboxed iframe -->
    <script>
      (function() {
        // Intercept Vite HMR WebSocket so it never produces failed connection errors in disabled-HMR sandbox
        try {
          var OrigWS = window.WebSocket;
          if (OrigWS) {
            window.WebSocket = function(url, protocols) {
              var urlStr = String(url || '');
              var isHmr = 
                urlStr.indexOf('localhost') !== -1 || 
                urlStr.indexOf('3000') !== -1 || 
                urlStr.indexOf('vite') !== -1 ||
                urlStr.indexOf('run.app') !== -1 ||
                (typeof window !== 'undefined' && window.location && (urlStr.indexOf(window.location.host) !== -1 || urlStr.indexOf(window.location.hostname) !== -1));
              
              if (isHmr) {
                var dummyWS = {
                  url: urlStr,
                  readyState: 1, // WebSocket.OPEN
                  send: function() {},
                  close: function() {},
                  addEventListener: function() {},
                  removeEventListener: function() {},
                  dispatchEvent: function() { return true; },
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                };
                setTimeout(function() {
                  if (typeof dummyWS.onopen === 'function') {
                    try { dummyWS.onopen({ type: 'open' }); } catch (err) {}
                  }
                }, 10);
                return dummyWS;
              }
              return new OrigWS(url, protocols);
            };
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (e) {}

        function shouldFilter(args) {
          if (!args || !args.length) return false;
          for (var i = 0; i < args.length; i++) {
            var a = args[i];
            if (a === null || a === undefined) continue;
            var str = '';
            if (typeof a === 'string') {
              str = a;
            } else {
              try { str = (a.message || '') + ' ' + (a.stack || '') + ' ' + (a.name || '') + ' ' + String(a); } catch (err) {}
            }
            var lower = str.toLowerCase();
            if (
              str.indexOf('[vite]') !== -1 ||
              str.indexOf('vite:') !== -1 ||
              lower.indexOf('[vite]') !== -1 ||
              lower.indexOf('vite') !== -1 ||
              lower.indexOf('websocket') !== -1 ||
              str.indexOf('@firebase/firestore') !== -1 ||
              str.indexOf('Could not reach Cloud Firestore') !== -1 ||
              str.indexOf('code=unavailable') !== -1 ||
              str.indexOf('the client is offline') !== -1
            ) {
              return true;
            }
          }
          return false;
        }

        ['error', 'warn', 'info', 'log', 'debug'].forEach(function(m) {
          var orig = console[m];
          if (!orig) return;
          console[m] = function() {
            if (shouldFilter(arguments)) return;
            orig.apply(console, arguments);
          };
        });

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          var src = (e && (e.filename || '')) || '';
          var lower = String(msg).toLowerCase();
          if (
            lower.indexOf('vite') !== -1 ||
            lower.indexOf('websocket') !== -1 ||
            lower.indexOf('firestore') !== -1 ||
            src.indexOf('@vite/client') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason) || '';
          var str = typeof reason === 'string' ? reason : (reason && reason.message) || String(reason);
          var lower = str.toLowerCase();
          if (
            lower.indexOf('vite') !== -1 ||
            lower.indexOf('websocket') !== -1 ||
            lower.indexOf('firestore') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Hide and remove any vite error overlay
        try {
          var observer = new MutationObserver(function(mutations) {
            for (var i = 0; i < mutations.length; i++) {
              var added = mutations[i].addedNodes;
              for (var j = 0; j < added.length; j++) {
                if (added[j].nodeName && added[j].nodeName.toLowerCase() === 'vite-error-overlay') {
                  added[j].remove();
                }
              }
            }
          });
          observer.observe(document.documentElement, { childList: true, subtree: true });
        } catch(e) {}
      })();
    </script>
    <style>
      vite-error-overlay {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
